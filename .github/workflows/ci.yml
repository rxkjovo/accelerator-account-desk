name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.404
      - name: Run tests
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Upload test previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-previews
          path: artifacts/visual-preview/*.png
          if-no-files-found: ignore
