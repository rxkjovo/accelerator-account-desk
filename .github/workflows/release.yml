name: 发布 Windows 版本
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.404
      - name: Test and build
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Create share package
        shell: pwsh
        run: ./scripts/package.ps1 -SkipBuild
      - name: Prepare installer compiler
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe')) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
      - name: Build double-click installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -SkipBuild
      - name: Verify custom installation and uninstall
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/AcceleratorDesk.App/AcceleratorDesk.App.csproj -Raw)).Project.PropertyGroup.Version
          ./scripts/test-installer.ps1 -InstallerPath "dist/releases/v$version/AcceleratorAccountDesk-$version-Setup-win-x64.exe"
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = ([xml](Get-Content src/AcceleratorDesk.App/AcceleratorDesk.App.csproj -Raw)).Project.PropertyGroup.Version
          $directory = "dist/releases/v$version"
          gh release view "v$version" 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'This version is already published. Increase the version before releasing again.' }
          gh release create "v$version" "$directory/AcceleratorAccountDesk-$version-Setup-win-x64.exe" "$directory/installer-manifest.json" "$directory/AcceleratorAccountDesk-$version-win-x64.zip" "$directory/update-manifest.json" --target $env:GITHUB_SHA --title "加速账户助手 v$version" --notes-file "$directory/release-notes.md"
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
